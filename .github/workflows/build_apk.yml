name: Build WoS Forensic Extractor ARM64 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android_arm64:
    name: Build Flutter ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK 36
        run: |
          sudo apt-get update
          sudo apt-get install -y file
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android Gradle skeleton with flutter create
        run: |
          flutter create . --org com.example --project-name wos_forensic_extractor --platforms android

      - name: Configure SDK 36, minSdk 24 and arm64-v8a
        run: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          if [ -f android/build.gradle.kts ]; then
            printf '\nsubprojects {\n    val applySdk: (Project) -> Unit = { p -> p.extensions.findByType<com.android.build.gradle.BaseExtension>()?.compileSdkVersion(36) }\n    if (state.executed) { applySdk(this) } else { afterEvaluate { applySdk(this) } }\n}\n' >> android/build.gradle.kts
          fi
          if [ -f android/build.gradle ]; then
            printf '\nsubprojects {\n    afterEvaluate {\n        if (project.hasProperty("android")) {\n            project.android.compileSdkVersion 36\n        }\n    }\n}\n' >> android/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/android {/android {\n    packaging { jniLibs { useLegacyPackaging = true } }/' android/app/build.gradle.kts
          fi

      - name: Verify native ARM64 ELF binaries
        run: |
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          file android/app/src/main/jniLibs/arm64-v8a/lib7zz.so
          file android/app/src/main/jniLibs/arm64-v8a/libunshield.so

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Release APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoS-Forensic-Extractor-ARM64-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
