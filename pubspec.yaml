name: wos_forensic_extractor
description: "Extractor forense y clasificador de recursos para Spider-Man: Web of Shadows (PC DVD / Xbox 360) con conversión de audio 48kHz lista para port."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.4
  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.11.0
  ffmpeg_kit_flutter_new: ">=1.6.1 <5.0.0"
  path: ^1.9.0
  path_provider: ^2.1.5
  archive: ^3.6.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
